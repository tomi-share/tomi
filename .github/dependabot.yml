# Weekly update PRs, grouped to limit noise. Security updates are opened by GitHub regardless of this schedule
# once "Dependabot security updates" is enabled in the repository settings.
# The Swift packages under apps/apple/Packages have no external dependency, so they are not listed.
version: 2

updates:
  # Rust workspace: tomi-core, tomi-cli, tomi-relay.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  # Windows app (separate Cargo workspace, Tauri).
  - package-ecosystem: cargo
    directory: /apps/windows/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # windows-future must stay on the windows-core of the `windows` crate (0.62.x, the latest
      # release) and of Tauri; windows-future 0.100 pulls windows-core 0.100, which no `windows`
      # release matches yet, so strong_auth.rs no longer compiles. Lift this once `windows`
      # publishes a 0.100 and bump both together.
      - dependency-name: windows-future
        versions: [">=0.100.0"]
    groups:
      windows-rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      windows-npm-minor-patch:
        update-types: [minor, patch]

  # Brand asset export tooling.
  - package-ecosystem: npm
    directory: /design/build
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # material3 is pinned on an alpha for the floating toolbar and bumped by hand, because its
      # API moves between alphas (see gradle/libs.versions.toml). The 1.6 alphas also pull
      # Compose 1.14 alphas into the build. Drop this rule in the change that moves the app to
      # a 1.6 alpha.
      - dependency-name: "androidx.compose.material3:material3"
        versions: [">=1.6.0-alpha01"]
    groups:
      android-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned by commit SHA; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
