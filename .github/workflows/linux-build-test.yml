name: Linux build test

# Experiment: does the desktop app (apps/windows, Tauri) build and pass its Rust tests on Linux?
# Runs only on pushes to the `ci/linux-build-test` branch (and manually from it). No secret, no
# publishing: the binary is a workflow artifact kept for a few days. Not meant to be merged as is.

on:
  push:
    branches: [ci/linux-build-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Same as ci.yml / docs/DEV.md.
  RUST_VERSION: "1.99"

# Actions pinned by commit SHA, same as ci.yml.
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   dtolnay/rust-toolchain  master  683b588c487a69d01f6c6ddf40f036ff682cc2c8
#   Swatinem/rust-cache     v2.9.3  d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   actions/setup-node      v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9

jobs:
  linux-app:
    name: Linux (Tauri app, tests + binary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # System libraries Tauri 2 needs on Debian/Ubuntu (WebKitGTK 4.1, GTK 3, tray, SVG, TLS).
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf build-essential pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
          key: linux-build-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Front-end dependencies
        working-directory: apps/windows
        run: npm ci
      - name: Front-end check (svelte-check)
        working-directory: apps/windows
        run: npm run check
      - name: Front-end build
        working-directory: apps/windows
        run: npm run build
      - name: App Rust tests
        working-directory: apps/windows/src-tauri
        run: cargo test --locked
      # `--no-bundle`: the Tauri bundle is configured for NSIS (Windows) only; this builds the binary.
      - name: tauri build (binary only)
        working-directory: apps/windows
        run: npx tauri build --no-bundle
      - name: Binary
        run: |
          set -euo pipefail
          bin="apps/windows/src-tauri/target/release/tomi-windows"
          ls -l "$bin"
          file "$bin"
          ldd "$bin" | head -30
          mkdir -p out && cp "$bin" out/tomi-linux-x86_64
          (cd out && sha256sum tomi-linux-x86_64 | tee tomi-linux-x86_64.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary
          path: out/*
          retention-days: 7
          if-no-files-found: error
