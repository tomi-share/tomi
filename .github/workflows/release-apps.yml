name: Release apps

# Stable releases of the apps built by CI, cut from a tag (docs/RELEASES.md, "Cutting a stable release"). One tag, one version
# number, one GitHub release for all of them, and that release is the repository's "Latest":
#
#   vX.Y.Z   a signed, non-debuggable Android APK and the Windows NSIS installer
#
# macOS is set aside (it cannot be signed and notarised in CI yet) and iOS goes through the stores; neither is in the release.
#
# What the workflow does, in order, and what makes it stop:
#   1. `prepare`: the tag is exactly vX.Y.Z; the versions stored in the repository (Android and Windows) match it and go up
#      from the previous release, versionCode included for Android; the tagged commit is on `main`; the repository is
#      public (the build provenance attestations that the release notes tell users to verify exist only for public ones);
#      the repository variable ALLOW_UNSIGNED_WINDOWS_RELEASE is "true" (the installer is not code-signed yet,
#      see "Windows code signing" in docs/RELEASES.md: this is a conscious decision, not a default; it is not needed once the
#      installer is signed through SignPath, which the repository variable SIGNPATH_ORGANIZATION_ID switches on).
#   2. `build`: the very same jobs as build-apps.yml (signed + verified APK, installer, checksums, attestations), called as a
#      reusable workflow. Nothing is published by it. Both must succeed: a release is all or nothing.
#   3. `publish`: re-checks the files, names them with the version, writes the notes (.github/scripts/release-notes.sh),
#      creates a DRAFT release, verifies the attestation of every file, then publishes. A stable release is created once
#      and never touched again: no --clobber, and an existing release for the tag stops the run (a tag is never reused).
#
# `workflow_dispatch` is a dry run: it validates and builds as if the given tag had been pushed and publishes nothing.
#
# Secrets and variables are the ones of build-apps.yml (ANDROID_RELEASE_*, ANDROID_RELEASE_CERT_SHA256, TOMI_RELAY_URL).

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: check and build as if this tag were pushed (vX.Y.Z). Publishes nothing."
        type: string
        required: true

permissions:
  contents: read

# Not the group of build-apps.yml, which the called workflow uses: a caller and its callee must not share one.
concurrency:
  group: release-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The whole history and every tag: the previous release is looked up, and the tagged commit is compared with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Versions match the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="$PUSHED_TAG"; fi
          out="$(bash .github/scripts/check-release-version.sh "$tag")"
          echo "$out"
          version="$(sed -n 's/^version=//p' <<<"$out")"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release::The tagged commit ${GITHUB_SHA} is not on main. Releases are cut from main only: merge first, then tag."
            exit 1
          fi
      - name: The repository is public
        if: github.event_name == 'push' && github.event.repository.private
        run: |
          echo "::error title=Release::This repository is private: build provenance attestations cannot be created, and the release notes tell users to verify them. Make the repository public first (docs/RELEASES.md)."
          exit 1
      # Signing through SignPath is on when SIGNPATH_ORGANIZATION_ID is set (see build-apps.yml): the installer is then signed and
      # this decision is not needed.
      - name: Windows installer signing decision
        if: github.event_name == 'push' && vars.SIGNPATH_ORGANIZATION_ID == ''
        env:
          ALLOW: ${{ vars.ALLOW_UNSIGNED_WINDOWS_RELEASE }}
        run: |
          if [ "$ALLOW" != "true" ]; then
            echo "::error title=Windows::The installer is not code-signed yet (SmartScreen will warn). Publishing it as a stable release must be a conscious decision: set the repository variable ALLOW_UNSIGNED_WINDOWS_RELEASE to true, or set up code signing first (docs/RELEASES.md, 'Windows code signing')."
            exit 1
          fi

  build:
    name: Build
    needs: prepare
    # A called workflow cannot ask for more than its caller grants, even for a job that is skipped. build-apps.yml has a
    # `publish` job (development pre-releases) that asks for `contents: write`; it never runs here (`publish: false` below),
    # and the build jobs themselves only ask for `contents: read`, so they keep that.
    permissions:
      contents: write
      actions: read         # the sign-windows job (SignPath) reads this run's details
      id-token: write       # attest-build-provenance (the called jobs sign with the identity of this run)
      attestations: write
    uses: ./.github/workflows/build-apps.yml
    with:
      android: true
      android_variant: release
      windows: true
      publish: false
    secrets: inherit

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Create the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHABLE: ${{ needs.build.outputs.android_publishable }}
          CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || needs.build.outputs.android_cert_sha256 }}
          # true when SignPath signed the Windows installer (the release notes then say so and name the certificate holder).
          WINDOWS_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ls -R dl

          # A tag is never reused (docs/RELEASES.md, rule 1): an existing release, draft or not, stops the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release::A release already exists for $TAG. A published tag is never reused: fix forward with a new version."
            exit 1
          fi

          # The artifact hand-over must not have altered the file; the copy is then named with the version and gets its own checksum.
          stage() { # <downloaded file> <final name>
            (cd "$(dirname "$1")" && sha256sum --check "$(basename "$1").sha256")
            cp "$1" "assets/$2"
            (cd assets && sha256sum "$2" > "$2.sha256")
          }

          mkdir -p assets
          # Both files are required: a release is all or nothing, and once published it cannot be completed.
          [ "$PUBLISHABLE" = true ] || { echo "::error title=Android::The APK is not a signed release build (are the ANDROID_RELEASE_* secrets set?)."; exit 1; }
          apk="$(find dl -name tomi-android-release.apk | head -n 1)"
          test -n "$apk"
          # Second, independent run of the check, on the file that is about to be uploaded.
          bash .github/scripts/verify-android-apk.sh "$apk" "$CERT"
          export ASSET_APK="tomi-android-${VERSION}.apk"
          stage "$apk" "$ASSET_APK"

          exe="$(find dl -name tomi-windows-setup.exe | head -n 1)"
          test -n "$exe"
          export ASSET_EXE="tomi-windows-${VERSION}-setup.exe"
          stage "$exe" "$ASSET_EXE"
          ls -l assets

          RELEASE_SHA="$SHA" RELEASE_RUN_URL="$RUN_URL" ANDROID_CERT_SHA256="$CERT" WINDOWS_SIGNED="$WINDOWS_SIGNED" bash .github/scripts/release-notes.sh "$TAG" > notes.md
          title="$(head -n 1 notes.md | sed 's/^# //')"

          # Draft first: published assets cannot be added or changed once "immutable releases" is on. `--latest`: this is the
          # repository's "Latest" release (the relay and the development builds never are, they pass `--latest=false`).
          # `--verify-tag`: the tag must already exist.
          gh release create "$TAG" --verify-tag --draft --latest --title "$title" --notes-file notes.md assets/*

          # Never publish what a user could not verify: every file must carry an attestation made by this repository's workflow.
          for f in assets/*; do
            case "$f" in *.sha256) continue ;; esac
            gh attestation verify "$f" --repo "$GH_REPO"
          done

          gh release edit "$TAG" --draft=false --latest
          echo "Published ${TAG} from ${SHA}."
