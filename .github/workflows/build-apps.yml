name: Build apps

# Builds the Android APK and the Windows installer (NSIS) on demand, then publishes them to the
# GitHub pre-releases `android-dev` and `windows-dev` (replaces a manual
# `gh release upload`). Manual trigger only: a Windows runner counts double against the quota of
# private repositories (limited minutes per month on the Free plan), so there is no build on every push.
# macOS / iOS: deliberately absent (a macOS runner costs 10x the rate).
#
# Optional secret: ANDROID_DEBUG_KEYSTORE_B64 = the maintainer's ~/.android/debug.keystore, base64
# encoded. Without it, CI signs with a new debug key and the APK cannot be installed over the one
# already on the phone (different signature).
# No release key is used here.

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android APK"
        type: boolean
        default: true
      android_variant:
        description: "Android variant (preview = release code signed with the debug key)"
        type: choice
        options: [debug, preview]
        default: debug
      windows:
        description: "Build the Windows installer"
        type: boolean
        default: true
      publish:
        description: "Publish to the GitHub releases (otherwise artifacts only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99"
  NDK_VERSION: "27.0.12077973"

# Actions pinned by SHA (readable tag in a comment):
#   actions/checkout          v6.1.0   d23441a48e516b6c34aea4fa41551a30e30af803
#   dtolnay/rust-toolchain    master   683b588c487a69d01f6c6ddf40f036ff682cc2c8
#   Swatinem/rust-cache       v2.9.3   d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   actions/setup-java        v5.7.0   b6effb05e454b25005698d916606bdc6ffcbf961
#   android-actions/setup-android v4.0.4 be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
#   gradle/actions/setup-gradle v6.4.1 8da46b539cd8fe6ab27ca75128919a18d757604c
#   actions/setup-node        v7.1.0   949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact   v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact v8.0.2   9000827ccba6bdab643e8b6fd33ac0654aef8333

jobs:
  android:
    name: Android (${{ inputs.android_variant }})
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-apps-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      # Stable debug key (optional): lets the APK be installed over the one already on the phone.
      # ANDROID_USER_HOME is forced: it is where AGP looks for debug.keystore (otherwise it generates a new one).
      - name: Debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            dir="${RUNNER_TEMP}/android-user"
            mkdir -p "$dir"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
            echo "ANDROID_USER_HOME=$dir" >> "$GITHUB_ENV"
            echo "DEBUG_KEYSTORE=$dir/debug.keystore" >> "$GITHUB_ENV"
            keytool -list -v -keystore "$dir/debug.keystore" -storepass android | grep -E "SHA256:"
            echo "Debug key from the ANDROID_DEBUG_KEYSTORE_B64 secret installed."
          else
            echo "::notice title=Android::ANDROID_DEBUG_KEYSTORE_B64 secret missing: ephemeral debug key, the APK will not install over an APK with another signature."
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Gradle itself compiles the Rust core (buildTomiCoreLibs) for arm64-v8a.
      - name: Assemble
        working-directory: apps/android
        env:
          VARIANT: ${{ inputs.android_variant }}
          # Repository variable (Settings > Secrets and variables > Actions > Variables), not a secret: the relay address is public.
          TOMI_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          task="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          # Without a compiled-in relay (variable absent or empty), the app waits for the one from the link, the QR code or the "Relay" field.
          relay_args=()
          if [ -n "${TOMI_RELAY_URL:-}" ]; then
            relay_args=("-PtomiRelayUrl=${TOMI_RELAY_URL}")
          else
            echo "::warning title=Android::TOMI_RELAY_URL repository variable missing: the APK is built without a default relay."
          fi
          bash gradlew --no-daemon --stacktrace "${relay_args[@]}" "$task"
      - name: Name the APK
        env:
          VARIANT: ${{ inputs.android_variant }}
        run: |
          set -euo pipefail
          apk="$(find apps/android/app/build/outputs/apk/"$VARIANT" -name '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p out
          cp "$apk" "out/tomi-${VARIANT}.apk"
          ls -l out
      # Refuses to publish an APK whose signature is not the one of the secret's key.
      - name: Verify signature
        if: env.DEBUG_KEYSTORE != ''
        env:
          VARIANT: ${{ inputs.android_variant }}
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "out/tomi-${VARIANT}.apk" | grep -m1 "SHA-256 digest" | sed 's/.*: *//')"
          echo "expected=$expected"; echo "actual  =$actual"
          test -n "$expected" && test "$expected" = "$actual"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer)
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
          key: build-apps-windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Front-end dependencies
        working-directory: apps/windows
        run: npm ci
      # `beforeBuildCommand` (npm run build) builds the front end; Tauri downloads NSIS.
      - name: tauri build
        working-directory: apps/windows
        shell: bash
        env:
          # Default relay compiled into the installer (repository variable, as for Android: the address
          # is public, not a secret). Read at compile time (`option_env!`); if absent or empty, the installer
          # is built without a default relay and the app waits for the one from the link, the QR code or the "Relay" field.
          TOMI_DEFAULT_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
        run: |
          if [ -z "${TOMI_DEFAULT_RELAY_URL:-}" ]; then
            echo "::warning title=Windows::TOMI_RELAY_URL repository variable missing: the installer is built without a default relay."
          fi
          npx tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find apps/windows/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n 1)"
          test -n "$exe"
          mkdir -p out
          cp "$exe" out/tomi-windows-setup.exe
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: out/tomi-windows-setup.exe
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to releases
    needs: [android, windows]
    # Skipped jobs (unchecked input) do not block; a failure does.
    if: >-
      always() && inputs.publish
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Upload
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          VARIANT: ${{ inputs.android_variant }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -R dl
          # Rolling development pre-releases; created on first use (see docs/RELEASES.md).
          ensure_release() {
            gh release view "$1" >/dev/null 2>&1 || gh release create "$1" \
              --prerelease --target "$SHA" --title "$2" \
              --notes "Rolling development build. Not a stable release (see docs/RELEASES.md)."
          }
          if [ "$ANDROID_RESULT" = "success" ]; then
            ensure_release android-dev "Android development build"
            gh release upload android-dev "$(find dl -name "tomi-${VARIANT}.apk" | head -n 1)" --clobber
          fi
          if [ "$WINDOWS_RESULT" = "success" ]; then
            ensure_release windows-dev "Windows development build"
            gh release upload windows-dev "$(find dl -name tomi-windows-setup.exe | head -n 1)" --clobber
          fi
          echo "Published from ${SHA}."
