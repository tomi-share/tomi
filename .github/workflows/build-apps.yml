name: Build apps

# Builds the Android APK and the Windows installer (NSIS) on demand, then publishes them to the
# GitHub pre-releases `android-dev` and `windows-dev`. Manual trigger only: a Windows runner counts
# double against the quota of private repositories (limited minutes per month on the Free plan), so
# there is no build on every push. macOS / iOS: deliberately absent (a macOS runner costs 10x the rate).
#
# Android publishing rules (docs/RELEASES.md has the setup):
#   - Only the non-debuggable `release` variant, signed with the dedicated RELEASE key from the repository
#     secrets below, is ever published. The check .github/scripts/verify-android-apk.sh runs after the build
#     AND again in the publish job, and fails on a debuggable APK or a debug-signed one.
#   - Without the secrets (a fork, a contributor's run) the APK is still built, but it is an UNSIGNED release
#     APK, or a debug APK if the `debug` variant is chosen. Both are named `...-UNSIGNED` / `...-DEBUG-ONLY`,
#     uploaded as workflow artifacts only (never as a release), and never silently signed with a debug key.
#
# Secrets (Settings > Secrets and variables > Actions), all four or none:
#   ANDROID_RELEASE_KEYSTORE_B64    the release keystore (.jks / .p12), base64-encoded
#   ANDROID_RELEASE_KEYSTORE_PASSWORD
#   ANDROID_RELEASE_KEY_ALIAS
#   ANDROID_RELEASE_KEY_PASSWORD    same as the store password for a PKCS12 keystore
# Optional repository variables:
#   ANDROID_RELEASE_CERT_SHA256     SHA-256 fingerprint of the release certificate (public). When set, the
#                                   publish job refuses any APK signed by another certificate.
#   TOMI_RELAY_URL                  default relay compiled into the apps (public, not a secret)
#
# Windows code signing with the SignPath Foundation (docs/RELEASES.md, "Windows code signing"; docs/CODE_SIGNING_POLICY.md).
# Off until the project is accepted and these are set; then the Windows installer is signed through SignPath before it is
# checksummed, attested and published:
#   SIGNPATH_API_TOKEN              secret: API token of the SignPath CI user (submitter permission on the signing policy)
#   SIGNPATH_ORGANIZATION_ID        variable: the SignPath organization ID. Its presence is the switch that turns signing on.
#   SIGNPATH_PROJECT_SLUG           variable: the SignPath project
#   SIGNPATH_SIGNING_POLICY_SLUG    variable: the signing policy (release-signing, each request approved by hand)

# Also callable (`workflow_call`) by release-apps.yml, which builds exactly the same files for a stable tag and publishes them
# itself: `publish` is then false, so the rolling pre-release step below never runs for a stable release. The called jobs
# need the `id-token` and `attestations` permissions that the caller grants them.
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android APK"
        type: boolean
        default: true
      android_variant:
        description: "Android variant (release = published when the release key is configured; debug = developer artifact, never published)"
        type: choice
        options: [release, debug]
        default: release
      windows:
        description: "Build the Windows installer"
        type: boolean
        default: true
      publish:
        description: "Publish to the GitHub releases (otherwise artifacts only)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      android:
        type: boolean
        default: true
      android_variant:
        type: string
        default: release
      windows:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
    outputs:
      android_publishable:
        description: "true for a signed release APK (the only kind that may be published)"
        value: ${{ jobs.android.outputs.publishable }}
      android_cert_sha256:
        description: "SHA-256 fingerprint of the certificate that signed the APK (public information)"
        value: ${{ jobs.android.outputs.cert_sha256 }}

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99"
  NDK_VERSION: "27.0.12077973"

# Actions pinned by SHA (readable tag in a comment):
#   actions/checkout          v6.1.0   d23441a48e516b6c34aea4fa41551a30e30af803
#   dtolnay/rust-toolchain    master   683b588c487a69d01f6c6ddf40f036ff682cc2c8
#   Swatinem/rust-cache       v2.9.3   d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   actions/setup-java        v5.7.0   b6effb05e454b25005698d916606bdc6ffcbf961
#   android-actions/setup-android v4.0.4 be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
#   gradle/actions/setup-gradle v6.4.1 8da46b539cd8fe6ab27ca75128919a18d757604c
#   actions/setup-node        v7.1.0   949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact   v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact v8.0.2   9000827ccba6bdab643e8b6fd33ac0654aef8333

jobs:
  android:
    name: Android (${{ inputs.android_variant }})
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The release signing secrets live in this environment, restricted to `main` and the android-v* / windows-v* tags, so that a
    # workflow changed on another branch cannot read them (docs/RELEASES.md, "Android release signing"). A run from another branch
    # is refused here. In a fork the environment is created empty, and the APK is then built unsigned, as documented.
    environment: release
    permissions:
      contents: read
      id-token: write       # attest-build-provenance: Sigstore signing identity of this workflow run
      attestations: write   # attest-build-provenance: stores the attestation
    outputs:
      # "true" only for a signed `release` APK. Anything else is a workflow artifact and is never published.
      publishable: ${{ steps.apk.outputs.publishable }}
      cert_sha256: ${{ steps.key.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-apps-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      # Release key from the repository secrets (docs/RELEASES.md). All four secrets or none: with none, the APK stays unsigned
      # (labelled, never published); with only some, the run fails rather than silently falling back to something weaker.
      - name: Release key
        id: key
        if: inputs.android_variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v:-}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::notice title=Android::No release key configured (ANDROID_RELEASE_* secrets): the APK will be UNSIGNED and will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error title=Android::The release signing secrets are partially configured ($present of 4). Set all of ANDROID_RELEASE_KEYSTORE_B64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD, or none."
            exit 1
          fi
          ks="${RUNNER_TEMP}/release-keystore"
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks")
          # Fingerprint of the certificate in the keystore (public information), read without putting the password on the command line.
          # (English output forced: the label "SHA256:" is parsed.)
          listing="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$ks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD 2>/dev/null || true)"
          fp="$(grep -m1 'SHA256:' <<<"$listing" | sed 's/.*SHA256: *//' | tr -d ': \r' | tr 'A-F' 'a-f' || true)"
          if ! printf '%s' "$fp" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error title=Android::Could not read the certificate of alias '${KEY_ALIAS}' in the release keystore (wrong password, alias or file?)."
            exit 1
          fi
          echo "Release certificate SHA-256: $fp"
          {
            echo "signed=true"
            echo "keystore=$ks"
            echo "cert_sha256=$fp"
          } >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Gradle itself compiles the Rust core (buildTomiCoreLibs) for arm64-v8a.
      # `release` is signed only when TOMI_RELEASE_KEYSTORE* are set (apps/android/app/build.gradle.kts), unsigned otherwise;
      # `debug` uses the ephemeral debug key of the runner. No variant ever uses a long-lived debug key from a secret.
      - name: Assemble
        working-directory: apps/android
        env:
          VARIANT: ${{ inputs.android_variant }}
          # Repository variable (Settings > Secrets and variables > Actions > Variables), not a secret: the relay address is public.
          TOMI_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
          TOMI_RELEASE_KEYSTORE: ${{ steps.key.outputs.keystore }}
          TOMI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          TOMI_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          TOMI_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          task="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          # Without a compiled-in relay (variable absent or empty), the app waits for the one from the link, the QR code or the "Relay" field.
          relay_args=()
          if [ -n "${TOMI_RELAY_URL:-}" ]; then
            relay_args=("-PtomiRelayUrl=${TOMI_RELAY_URL}")
          else
            echo "::notice title=Android::No default relay compiled in (optional TOMI_RELAY_URL repository variable not set)."
          fi
          bash gradlew --no-daemon --stacktrace "${relay_args[@]}" "$task"
      # The file name tells what the artifact is. Only a signed `release` build is publishable.
      - name: Name the APK
        id: apk
        env:
          VARIANT: ${{ inputs.android_variant }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          set -euo pipefail
          apks="$(find "apps/android/app/build/outputs/apk/${VARIANT}" -name '*.apk')"
          if [ "$(printf '%s\n' "$apks" | grep -c .)" -ne 1 ]; then
            echo "::error title=Android::Expected exactly one APK for the ${VARIANT} variant, found:"; printf '%s\n' "$apks"
            exit 1
          fi
          if [ "$VARIANT" = release ] && [ "$SIGNED" = true ]; then
            name=tomi-android-release.apk; publishable=true
          elif [ "$VARIANT" = release ]; then
            name=tomi-android-release-UNSIGNED.apk; publishable=false
            echo "::warning title=Android::UNSIGNED release APK (no release key configured): workflow artifact only, it will not be published and does not install."
          else
            name=tomi-android-debug-DEBUG-ONLY.apk; publishable=false
            echo "::warning title=Android::DEBUG APK (debuggable, debug-signed): developer artifact only, it will not be published."
          fi
          mkdir -p out
          cp "$apks" "out/${name}"
          echo "publishable=${publishable}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l out
      # Fails the job if the APK that would be published is debuggable, unsigned, or signed with a debug certificate, or with a
      # certificate other than the pinned one (variable ANDROID_RELEASE_CERT_SHA256 when set, else the one of the keystore).
      - name: Verify the APK (not debuggable, not debug-signed)
        if: steps.apk.outputs.publishable == 'true'
        env:
          APK: out/${{ steps.apk.outputs.name }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || steps.key.outputs.cert_sha256 }}
        run: bash .github/scripts/verify-android-apk.sh "$APK" "$EXPECTED_CERT"
      # SHA-256 in `sha256sum` format (lowercase hash, two spaces, file name) so that `sha256sum --check` works.
      - name: Checksum
        env:
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          (cd out && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
      # Build provenance (Sigstore, signed by GitHub): `gh attestation verify` proves which workflow, repository and commit
      # produced the file. Public repositories only: attestations of private repositories need a paid plan.
      - name: Attest build provenance
        if: steps.apk.outputs.publishable == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ steps.apk.outputs.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: out/*
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer)
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write       # attest-build-provenance: Sigstore signing identity of this workflow run
      attestations: write   # attest-build-provenance: stores the attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
      # Only when SignPath is configured: the artifact that the sign-windows job submits for signing.
      unsigned_artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
          key: build-apps-windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Front-end dependencies
        working-directory: apps/windows
        run: npm ci
      # The version of the installer, as written in tauri.conf.json: SignPath enforces it (see docs/RELEASES.md, "Windows code signing").
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/windows/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      # `beforeBuildCommand` (npm run build) builds the front end; Tauri downloads NSIS.
      - name: tauri build
        working-directory: apps/windows
        shell: bash
        env:
          # Default relay compiled into the installer (repository variable, as for Android: the address
          # is public, not a secret). Read at compile time (`option_env!`); if absent or empty, the installer
          # is built without a default relay and the app waits for the one from the link, the QR code or the "Relay" field.
          TOMI_DEFAULT_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
        run: |
          if [ -z "${TOMI_DEFAULT_RELAY_URL:-}" ]; then
            echo "::notice title=Windows::No default relay compiled in (optional TOMI_RELAY_URL repository variable not set)."
          fi
          npx tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find apps/windows/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n 1)"
          test -n "$exe"
          mkdir -p out
          cp "$exe" out/tomi-windows-setup.exe
          ls -l out
      # Code signing is configured by the repository variable SIGNPATH_ORGANIZATION_ID (docs/RELEASES.md, "Windows code signing").
      # Without it, nothing below changes: the installer is checksummed, attested and uploaded unsigned, as before. With it, the
      # unsigned installer goes to SignPath (job sign-windows) and the checksum, the attestation and the `windows-installer`
      # artifact are made there, on the SIGNED file. A file name that differs from the final one, because upload-artifact with
      # `archive: false` names the artifact after the file and refuses a name already used in the run.
      - name: Stage the unsigned installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          cp out/tomi-windows-setup.exe unsigned/tomi-windows-setup-unsigned.exe
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: unsigned/tomi-windows-setup-unsigned.exe
          archive: false
          retention-days: 14
          if-no-files-found: error
      # SHA-256 in `sha256sum` format (lowercase hash, two spaces, file name), as for the relay binaries.
      - name: Checksum
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash out/tomi-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tomi-windows-setup.exe" | Out-File -Encoding ascii -NoNewline out/tomi-windows-setup.exe.sha256
          Get-Content out/tomi-windows-setup.exe.sha256
      # Build provenance (Sigstore, signed by GitHub): `gh attestation verify` proves which workflow, repository and commit
      # produced the installer. Public repositories only: attestations of private repositories need a paid plan.
      - name: Attest build provenance
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/tomi-windows-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        with:
          name: windows-installer
          path: out/*
          retention-days: 14
          if-no-files-found: error

  # Only when SignPath is configured. The unsigned installer built above is submitted to SignPath, which verifies its origin
  # (this repository, this commit, this workflow run, GitHub-hosted runners) and holds the request until an approver approves it
  # by hand. The signed file is then checked, checksummed, attested and uploaded as `windows-installer`, the artifact that the
  # publish step (or release-apps.yml) takes. The job is on a Windows runner only to be able to check the Authenticode signature.
  sign-windows:
    name: Windows (sign with SignPath)
    needs: windows
    if: ${{ inputs.windows && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    # The SignPath API token (secret SIGNPATH_API_TOKEN) goes into this same environment, with the same branch and tag restrictions.
    environment: release
    # A human approves each request: leave time for that (the SignPath action waits for it below).
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read         # SignPath reads this run's details (needed on a private repository without the SignPath GitHub App)
      id-token: write       # attest-build-provenance
      attestations: write
    steps:
      # actions pinned by commit SHA like all the others (SignPath v3).
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: "${{ needs.windows.outputs.version }}"
      - name: Name the signed installer
        shell: bash
        run: |
          set -euo pipefail
          files="$(find signed -type f -name '*.exe')"
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ne 1 ]; then
            echo "::error title=Windows::Expected exactly one signed .exe from SignPath, found:"; printf '%s\n' "$files"
            exit 1
          fi
          mkdir -p out
          cp "$files" out/tomi-windows-setup.exe
          ls -l out
      # Fails closed: a file that is not validly signed is never published.
      - name: Verify the signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature out/tomi-windows-setup.exe
          $sig | Format-List Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter
          if ($sig.Status -ne 'Valid') { throw "The installer is not validly signed (status: $($sig.Status))." }
      - name: Checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash out/tomi-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tomi-windows-setup.exe" | Out-File -Encoding ascii -NoNewline out/tomi-windows-setup.exe.sha256
          Get-Content out/tomi-windows-setup.exe.sha256
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/tomi-windows-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: out/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to releases
    needs: [android, windows, sign-windows]
    # Skipped jobs (unchecked input, or signing not configured) do not block; a failure does, signing included. Android counts
    # only when its APK is publishable (signed `release` build); an unsigned or debug APK stays a workflow artifact.
    if: >-
      always() && inputs.publish
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && ((needs.android.result == 'success' && needs.android.outputs.publishable == 'true') || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # For .github/scripts/verify-android-apk.sh (the same commit as this workflow run).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Upload
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_PUBLISHABLE: ${{ needs.android.outputs.publishable }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || needs.android.outputs.cert_sha256 }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -R dl

          # The files must still match the checksums computed by the build jobs (integrity of the artifact hand-over).
          verify_checksum() {
            (cd "$(dirname "$1")" && sha256sum --check "$(basename "$1").sha256")
          }

          # Rolling development pre-releases; created on first use (see docs/RELEASES.md). Refuses to touch a release that is
          # not a pre-release, so that this workflow can never overwrite the assets of a stable release.
          ensure_release() {
            if gh release view "$1" >/dev/null 2>&1; then
              if [ "$(gh release view "$1" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
                echo "::error title=Release::$1 is not a pre-release: refusing to replace its assets."
                exit 1
              fi
            else
              gh release create "$1" --prerelease --target "$SHA" --title "$2" \
                --notes "Rolling development build. Not a stable release (see docs/RELEASES.md)."
            fi
          }

          # Replaces the assets of the rolling release `$1` with the files after the title `$2`, removes the other assets, and
          # states in the notes which commit and run produced them and how to verify them. `--clobber` is deliberate and limited
          # to these rolling `*-dev` pre-releases, which are replaced by design; every replacement comes with a new checksum
          # and a new build-provenance attestation, and the notes name the commit. Stable releases (`*-vX.Y.Z` tags) must never
          # use --clobber: they are created once, and a fix is a new version (docs/RELEASES.md, rule 1).
          publish_rolling() {
            local tag="$1" title="$2" main keep=" " f asset
            shift 2
            main="$(basename "$1")"
            ensure_release "$tag" "$title"
            gh release upload "$tag" "$@" --clobber
            for f in "$@"; do keep="${keep}$(basename "$f") "; done
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              case "$keep" in
                *" ${asset} "*) ;;
                *) echo "Removing stale asset: ${asset}"; gh release delete-asset "$tag" "$asset" --yes ;;
              esac
            done
            gh release edit "$tag" --notes "Rolling development build: its assets are REPLACED by every run of the workflow, so this is not a stable release (see docs/RELEASES.md).

          Built from commit ${SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verify a download (details in docs/RELEASES.md, \"Verifying a download\"):

              sha256sum --check ${main}.sha256
              gh attestation verify ${main} --repo ${GITHUB_REPOSITORY}"
          }

          if [ "$ANDROID_RESULT" = "success" ] && [ "$ANDROID_PUBLISHABLE" = "true" ]; then
            apk="$(find dl -name tomi-android-release.apk | head -n 1)"
            test -n "$apk"
            verify_checksum "$apk"
            # Second, independent run of the check, on the file that is about to be uploaded (not on the build job's copy).
            bash .github/scripts/verify-android-apk.sh "$apk" "$EXPECTED_CERT"
            publish_rolling android-dev "Android development build" "$apk" "$apk.sha256"
          elif [ "$ANDROID_RESULT" = "success" ]; then
            echo "::notice title=Android::The APK is not a signed release build: not published."
          fi

          if [ "$WINDOWS_RESULT" = "success" ]; then
            exe="$(find dl -name tomi-windows-setup.exe | head -n 1)"
            test -n "$exe"
            verify_checksum "$exe"
            publish_rolling windows-dev "Windows development build" "$exe" "$exe.sha256"
          fi
          echo "Published from ${SHA}."
