name: Build apps

# Builds the Android APK and the Windows installer (NSIS) on demand, then publishes them to the
# GitHub pre-releases `android-dev` and `windows-dev`. Manual trigger only: a Windows runner counts
# double against the quota of private repositories (limited minutes per month on the Free plan), so
# there is no build on every push. macOS / iOS: deliberately absent (a macOS runner costs 10x the rate).
#
# Android publishing rules (docs/RELEASES.md has the setup):
#   - Only the non-debuggable `release` variant, signed with the dedicated RELEASE key from the repository
#     secrets below, is ever published. The check .github/scripts/verify-android-apk.sh runs after the build
#     AND again in the publish job, and fails on a debuggable APK or a debug-signed one.
#   - Without the secrets (a fork, a contributor's run) the APK is still built, but it is an UNSIGNED release
#     APK, or a debug APK if the `debug` variant is chosen. Both are named `...-UNSIGNED` / `...-DEBUG-ONLY`,
#     uploaded as workflow artifacts only (never as a release), and never silently signed with a debug key.
#
# Secrets (Settings > Secrets and variables > Actions), all four or none:
#   ANDROID_RELEASE_KEYSTORE_B64    the release keystore (.jks / .p12), base64-encoded
#   ANDROID_RELEASE_KEYSTORE_PASSWORD
#   ANDROID_RELEASE_KEY_ALIAS
#   ANDROID_RELEASE_KEY_PASSWORD    same as the store password for a PKCS12 keystore
# Optional repository variables:
#   ANDROID_RELEASE_CERT_SHA256     SHA-256 fingerprint of the release certificate (public). When set, the
#                                   publish job refuses any APK signed by another certificate.
#   TOMI_RELAY_URL                  default relay compiled into the apps (public, not a secret)

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android APK"
        type: boolean
        default: true
      android_variant:
        description: "Android variant (release = published when the release key is configured; debug = developer artifact, never published)"
        type: choice
        options: [release, debug]
        default: release
      windows:
        description: "Build the Windows installer"
        type: boolean
        default: true
      publish:
        description: "Publish to the GitHub releases (otherwise artifacts only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99"
  NDK_VERSION: "27.0.12077973"

# Actions pinned by SHA (readable tag in a comment):
#   actions/checkout          v6.1.0   d23441a48e516b6c34aea4fa41551a30e30af803
#   dtolnay/rust-toolchain    master   683b588c487a69d01f6c6ddf40f036ff682cc2c8
#   Swatinem/rust-cache       v2.9.3   d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   actions/setup-java        v5.7.0   b6effb05e454b25005698d916606bdc6ffcbf961
#   android-actions/setup-android v4.0.4 be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
#   gradle/actions/setup-gradle v6.4.1 8da46b539cd8fe6ab27ca75128919a18d757604c
#   actions/setup-node        v7.1.0   949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact   v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact v8.0.2   9000827ccba6bdab643e8b6fd33ac0654aef8333

jobs:
  android:
    name: Android (${{ inputs.android_variant }})
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # "true" only for a signed `release` APK. Anything else is a workflow artifact and is never published.
      publishable: ${{ steps.apk.outputs.publishable }}
      cert_sha256: ${{ steps.key.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-apps-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      # Release key from the repository secrets (docs/RELEASES.md). All four secrets or none: with none, the APK stays unsigned
      # (labelled, never published); with only some, the run fails rather than silently falling back to something weaker.
      - name: Release key
        id: key
        if: inputs.android_variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v:-}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::notice title=Android::No release key configured (ANDROID_RELEASE_* secrets): the APK will be UNSIGNED and will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error title=Android::The release signing secrets are partially configured ($present of 4). Set all of ANDROID_RELEASE_KEYSTORE_B64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD, or none."
            exit 1
          fi
          ks="${RUNNER_TEMP}/release-keystore"
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks")
          # Fingerprint of the certificate in the keystore (public information), read without putting the password on the command line.
          # (English output forced: the label "SHA256:" is parsed.)
          fp="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$ks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sed -n '/SHA256:/{s/^ *SHA256: *//p;q}' | tr -d ': ' | tr 'A-F' 'a-f')"
          if ! printf '%s' "$fp" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error title=Android::Could not read the certificate of alias '${KEY_ALIAS}' in the release keystore (wrong password, alias or file?)."
            exit 1
          fi
          echo "Release certificate SHA-256: $fp"
          {
            echo "signed=true"
            echo "keystore=$ks"
            echo "cert_sha256=$fp"
          } >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Gradle itself compiles the Rust core (buildTomiCoreLibs) for arm64-v8a.
      # `release` is signed only when TOMI_RELEASE_KEYSTORE* are set (apps/android/app/build.gradle.kts), unsigned otherwise;
      # `debug` uses the ephemeral debug key of the runner. No variant ever uses a long-lived debug key from a secret.
      - name: Assemble
        working-directory: apps/android
        env:
          VARIANT: ${{ inputs.android_variant }}
          # Repository variable (Settings > Secrets and variables > Actions > Variables), not a secret: the relay address is public.
          TOMI_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
          TOMI_RELEASE_KEYSTORE: ${{ steps.key.outputs.keystore }}
          TOMI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          TOMI_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          TOMI_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          task="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          # Without a compiled-in relay (variable absent or empty), the app waits for the one from the link, the QR code or the "Relay" field.
          relay_args=()
          if [ -n "${TOMI_RELAY_URL:-}" ]; then
            relay_args=("-PtomiRelayUrl=${TOMI_RELAY_URL}")
          else
            echo "::notice title=Android::No default relay compiled in (optional TOMI_RELAY_URL repository variable not set)."
          fi
          bash gradlew --no-daemon --stacktrace "${relay_args[@]}" "$task"
      # The file name tells what the artifact is. Only a signed `release` build is publishable.
      - name: Name the APK
        id: apk
        env:
          VARIANT: ${{ inputs.android_variant }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          set -euo pipefail
          apks="$(find "apps/android/app/build/outputs/apk/${VARIANT}" -name '*.apk')"
          if [ "$(printf '%s\n' "$apks" | grep -c .)" -ne 1 ]; then
            echo "::error title=Android::Expected exactly one APK for the ${VARIANT} variant, found:"; printf '%s\n' "$apks"
            exit 1
          fi
          if [ "$VARIANT" = release ] && [ "$SIGNED" = true ]; then
            name=tomi-android-release.apk; publishable=true
          elif [ "$VARIANT" = release ]; then
            name=tomi-android-release-UNSIGNED.apk; publishable=false
            echo "::warning title=Android::UNSIGNED release APK (no release key configured): workflow artifact only, it will not be published and does not install."
          else
            name=tomi-android-debug-DEBUG-ONLY.apk; publishable=false
            echo "::warning title=Android::DEBUG APK (debuggable, debug-signed): developer artifact only, it will not be published."
          fi
          mkdir -p out
          cp "$apks" "out/${name}"
          echo "publishable=${publishable}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l out
      # Fails the job if the APK that would be published is debuggable, unsigned, or signed with a debug certificate, or with a
      # certificate other than the pinned one (variable ANDROID_RELEASE_CERT_SHA256 when set, else the one of the keystore).
      - name: Verify the APK (not debuggable, not debug-signed)
        if: steps.apk.outputs.publishable == 'true'
        env:
          APK: out/${{ steps.apk.outputs.name }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || steps.key.outputs.cert_sha256 }}
        run: bash .github/scripts/verify-android-apk.sh "$APK" "$EXPECTED_CERT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer)
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
          key: build-apps-windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Front-end dependencies
        working-directory: apps/windows
        run: npm ci
      # `beforeBuildCommand` (npm run build) builds the front end; Tauri downloads NSIS.
      - name: tauri build
        working-directory: apps/windows
        shell: bash
        env:
          # Default relay compiled into the installer (repository variable, as for Android: the address
          # is public, not a secret). Read at compile time (`option_env!`); if absent or empty, the installer
          # is built without a default relay and the app waits for the one from the link, the QR code or the "Relay" field.
          TOMI_DEFAULT_RELAY_URL: ${{ vars.TOMI_RELAY_URL }}
        run: |
          if [ -z "${TOMI_DEFAULT_RELAY_URL:-}" ]; then
            echo "::notice title=Windows::No default relay compiled in (optional TOMI_RELAY_URL repository variable not set)."
          fi
          npx tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find apps/windows/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n 1)"
          test -n "$exe"
          mkdir -p out
          cp "$exe" out/tomi-windows-setup.exe
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: out/tomi-windows-setup.exe
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to releases
    needs: [android, windows]
    # Skipped jobs (unchecked input) do not block; a failure does. Android counts only when its APK is publishable
    # (signed `release` build); an unsigned or debug APK stays a workflow artifact.
    if: >-
      always() && inputs.publish
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && ((needs.android.result == 'success' && needs.android.outputs.publishable == 'true') || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # For .github/scripts/verify-android-apk.sh (the same commit as this workflow run).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Upload
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_PUBLISHABLE: ${{ needs.android.outputs.publishable }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || needs.android.outputs.cert_sha256 }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -R dl
          # Rolling development pre-releases; created on first use (see docs/RELEASES.md).
          ensure_release() {
            gh release view "$1" >/dev/null 2>&1 || gh release create "$1" \
              --prerelease --target "$SHA" --title "$2" \
              --notes "Rolling development build. Not a stable release (see docs/RELEASES.md)."
          }
          if [ "$ANDROID_RESULT" = "success" ] && [ "$ANDROID_PUBLISHABLE" = "true" ]; then
            apk="$(find dl -name tomi-android-release.apk | head -n 1)"
            test -n "$apk"
            # Second, independent run of the check, on the file that is about to be uploaded (not on the build job's copy).
            bash .github/scripts/verify-android-apk.sh "$apk" "$EXPECTED_CERT"
            ensure_release android-dev "Android development build"
            gh release upload android-dev "$apk" --clobber
            # The rolling release must not keep the debug / preview APKs that earlier versions of this workflow published.
            gh release view android-dev --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                tomi-android-release.apk) ;;
                *) echo "Removing stale asset: $asset"; gh release delete-asset android-dev "$asset" --yes ;;
              esac
            done
          elif [ "$ANDROID_RESULT" = "success" ]; then
            echo "::notice title=Android::The APK is not a signed release build: not published."
          fi
          if [ "$WINDOWS_RESULT" = "success" ]; then
            ensure_release windows-dev "Windows development build"
            gh release upload windows-dev "$(find dl -name tomi-windows-setup.exe | head -n 1)" --clobber
          fi
          echo "Published from ${SHA}."
