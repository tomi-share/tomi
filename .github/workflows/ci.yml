name: CI

# No secret required: CI signs nothing and publishes nothing (see release-relay.yml).
# Path filters: the `changes` job computes what changed and each build job is conditioned on it
# (a `paths:` filter at workflow level would not allow filtering job by job).
#
# Apple: a macOS runner counts 10x against the quota of private repositories, hence three levels.
#   1. `apple-generated` (Linux, free)  : are the derived files up to date? On every PR.
#   2. `apple-packages`  (macOS, ~5 min): TomiKit and TomiDesign, pure Swift packages. On every PR.
#   3. `apple-app`       (macOS, ~30 min): iOS Rust core, app and tests on a simulator. Only on a
#      push to main or on a manual run with the `apple_app` box ticked.
# Job 3 runs on the `xcode-27` image (Xcode 27.2, iOS 27 SDK): `macos-latest` only has the iOS 26
# SDK and cannot compile `toolbarVerticalEdge` (iOS 27.1). It is a preview image at GitHub; if the
# label goes away, switch to `macos-latest` once Xcode 27 is its default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apple_app:
        description: "Full Apple job (iOS core + app + simulator): macOS runner, 10x the quota"
        type: boolean
        default: false

# Minimal rights for all jobs; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Aligned with docs/DEV.md (Rust 1.99). Change it here, in one place only, when upgrading.
  RUST_VERSION: "1.99"
  NDK_VERSION: "27.0.12077973"

# Actions pinned by full commit SHA (the readable tag is in a comment).
#   actions/checkout                 v6.1.0   d23441a48e516b6c34aea4fa41551a30e30af803
#   dtolnay/rust-toolchain           master   683b588c487a69d01f6c6ddf40f036ff682cc2c8 (no version tags: the SHA + `toolchain:` fix the Rust version)
#   Swatinem/rust-cache              v2.9.3   d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   actions/setup-java               v5.7.0   b6effb05e454b25005698d916606bdc6ffcbf961
#   android-actions/setup-android    v4.0.4   be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
#   gradle/actions/setup-gradle      v6.4.1   8da46b539cd8fe6ab27ca75128919a18d757604c
#   actions/upload-artifact          v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/setup-node               v7.1.0   949feb2413d6458794dcd2491c4babbbce0c15c1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
      spec: ${{ steps.filter.outputs.spec }}
      apple: ${{ steps.filter.outputs.apple }}
      apple_app: ${{ steps.filter.outputs.apple_app }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_all() {
            echo "Full run ($1)"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "spec=true" >> "$GITHUB_OUTPUT"
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "apple_app=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            if [ -f apps/android/gradlew ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          }

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA" ;;
            *)            run_all "manual trigger"; exit 0 ;;
          esac

          # First push of a branch (null SHA) or rewritten history: we cannot compare.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_all "comparison base not found"
            exit 0
          fi

          git diff --name-only "$base" "$HEAD_SHA" > changed.txt
          echo "Changed files:"; sed 's/^/  /' changed.txt

          matches() { grep -Eq "$1" changed.txt && echo true || echo false; }

          # Rust: crates, relay, workspace, spec vectors (used by the tests), this workflow.
          rust="$(matches '^(crates/|apps/relay/|spec/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/ci\.yml$)')"
          # Android: only apps/android/** (and this workflow). See the rationale: a change in
          # crates/core does not trigger this job.
          android="$(matches '^(apps/android/|\.github/workflows/ci\.yml$)')"
          # Spec: vectors and the crate that reads them.
          spec="$(matches '^(spec/|crates/core/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)')"
          # Apple, cheap jobs (check on Linux, pure Swift packages on macOS). Deliberately without
          # crates/core: a change of the core must not wake a macOS runner, billed 10x the quota.
          # The Android texts and the tokens of the charter count: the catalog and TomiTokens.swift
          # derive from them.
          apple="$(matches '^(apps/apple/|design/tomi/tokens\.json$|apps/android/app/src/main/res/values/strings\.xml$|\.github/workflows/ci\.yml$)')"
          # Apple, full job (iOS Rust core + app + tests on a simulator): it embeds the core.
          apple_app="$(matches '^(apps/apple/|crates/core/|Cargo\.(toml|lock)$|design/tomi/tokens\.json$|apps/android/app/src/main/res/values/strings\.xml$|\.github/workflows/ci\.yml$)')"
          # Windows: the Tauri app (its own workspace) and the core it embeds.
          windows="$(matches '^(apps/windows/|crates/core/|\.github/workflows/ci\.yml$)')"

          # No Android project in the repository: nothing to build.
          if [ "$android" = "true" ] && [ ! -f apps/android/gradlew ]; then
            echo "apps/android/gradlew missing: Android job skipped"
            android=false
          fi

          { echo "rust=$rust"; echo "android=$android"; echo "spec=$spec"
            echo "apple=$apple"; echo "apple_app=$apple_app"; echo "windows=$windows"; } >> "$GITHUB_OUTPUT"
          echo "rust=$rust android=$android spec=$spec apple=$apple apple_app=$apple_app windows=$windows"

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (core demo mode)
        run: cargo clippy -p tomi-core --all-targets --features demo --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
      - name: tests (core demo mode)
        run: cargo test -p tomi-core --features demo --locked

  core-windows:
    name: Core on Windows (build + tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build core and CLI
        run: cargo build -p tomi-core -p tomi-cli --locked
      - name: core tests
        run: cargo test -p tomi-core --locked

  spec:
    name: Spec (vectors)
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Does the spec_vectors test exist?
        id: detect
        run: |
          set -euo pipefail
          # Cargo knows whether the test target exists (auto-discovered tests/spec_vectors.rs or [[test]]).
          if cargo metadata --no-deps --format-version 1 --locked \
            | jq -e '.packages[] | select(.name == "tomi-core") | .targets[] | select(.name == "spec_vectors" and (.kind | index("test")))' > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Spec::The tomi-core/spec_vectors test does not exist yet: step skipped."
          fi
      # As soon as the test exists, any error (compilation or wrong vector) fails the job.
      - name: Spec vectors
        if: steps.detect.outputs.present == 'true'
        run: cargo test -p tomi-core --test spec_vectors --locked

  # The Windows app (Tauri): front end checked and built (the Rust build embeds it), then the
  # app's Rust tests. Separate workspace (its own Cargo.lock). No clippy here. Counts double.
  windows-app:
    name: Windows (Tauri app, check + tests)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      # One step per command: under PowerShell, a command failing in the middle of a block
      # does not stop the block.
      - name: Front-end dependencies
        working-directory: apps/windows
        run: npm ci
      - name: Front-end check (svelte-check)
        working-directory: apps/windows
        run: npm run check
      - name: Front-end build
        working-directory: apps/windows
        run: npm run build
      - name: App Rust tests
        working-directory: apps/windows/src-tauri
        run: cargo test --locked

  android:
    name: Android (assembleDebug, unit tests, lint)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - name: NDK variables
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      # Native libraries of the core (same command as `just android-ndk-libs`, in debug and for two
      # ABIs for CI). Remove this if the Gradle build compiles the core itself.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-ndk and native libraries
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/app/src/main/jniLibs build -p tomi-core --locked
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only runs on the main branch write the Gradle cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # `bash gradlew`: does not require the executable bit (lost when the file is added from Windows).
      - name: assembleDebug + unit tests + lint
        working-directory: apps/android
        run: bash gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The texts and the colours of the Apple app derive from common sources of truth (the Android
  # strings, the tokens of the charter) through two Python scripts, and the result is committed. This
  # job replays them and refuses any difference: without it, a string removed from Android silently
  # disappears from the iOS catalog and the app shows the raw key. On Linux, so free, and before any
  # macOS runner.
  apple-generated:
    name: Apple (generated files up to date)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # strings-from-android.py fails by itself if an `ios_` key also exists on the Android side.
      - name: Replay the generators
        working-directory: apps/apple
        run: |
          set -euo pipefail
          python3 -I tools/tokens-to-swift.py
          python3 -I tools/strings-from-android.py
      - name: No difference with the sources of truth
        run: |
          set -euo pipefail
          generated="apps/apple/Packages/TomiDesign/Sources/TomiDesign/TomiTokens.swift apps/apple/Tomi/Resources/Localizable.xcstrings"
          if ! git diff --quiet -- $generated; then
            echo "::error title=Apple generated files::The derived files no longer match their sources. Run \`just apple-project\` (or the two scripts of apps/apple/tools) and commit the result."
            git --no-pager diff --stat -- $generated
            git --no-pager diff -- $generated | head -200
            exit 1
          fi
          echo "Text catalog and tokens of the charter up to date."

  # The two pure Swift packages (no UIKit, no Rust core): they test on macOS in a few minutes and
  # carry the logic shared with Android, layout rules included.
  apple-packages:
    name: Apple (TomiKit, TomiDesign)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode version
        run: xcodebuild -version
      - name: TomiKit tests
        run: swift test --package-path apps/apple/Packages/TomiKit
      - name: TomiDesign tests
        run: swift test --package-path apps/apple/Packages/TomiDesign

  # The full job: Rust core compiled for iOS and packaged as an XCFramework, Xcode project
  # regenerated, then TomiRuntime and the app tested on a simulator. Expensive, so never on a PR.
  apple-app:
    name: Apple (iOS core, app, simulator)
    needs: changes
    if: >-
      needs.changes.outputs.apple_app == 'true'
      && (github.ref == 'refs/heads/main' || inputs.apple_app)
    # Preview image: the only one with Xcode 27 (iOS 27 SDK). See the header of the file.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image offers several Xcode 27; take the most recent rather than the default one.
      - name: Pick Xcode 27
        run: |
          set -euo pipefail
          app="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$app" ]; then sudo xcode-select -s "$app"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `--debug`: CI checks that it compiles, runs and passes the tests, not performance.
      # Same script as `just apple-core`, hence the same XCFramework as locally.
      - name: Rust core for iOS (XCFramework)
        run: bash apps/apple/tools/build-core.sh --debug
      - name: XcodeGen
        run: brew install xcodegen
      # Tomi.xcodeproj is not committed: project.yml and the xcconfig files are its source.
      - name: Regenerate the Xcode project
        working-directory: apps/apple
        run: |
          set -euo pipefail
          python3 -I tools/tokens-to-swift.py
          python3 -I tools/strings-from-android.py
          xcodegen generate
      # `--any-iphone` without a name: any iPhone of the image, ordinary runtimes first. Never the
      # iPhone Duo, which has a runtime of its own: that two-screen simulator loses the test runner
      # on a runner ("Lost pending connection to the test runner before launch"). The layout rules
      # of the Duo are covered by the TomiKit tests, which run on macOS.
      #
      # The simulator is booted and awaited here: xcodebuild booting it itself at the moment of
      # launching the tests is the other classic cause of this error.
      - name: Boot a simulator
        run: |
          set -euo pipefail
          udid="$(bash apps/apple/tools/simulator-udid.sh --any-iphone)"
          name="$(xcrun simctl list devices available | grep "$udid" | sed 's/^ *//;s/ (.*//')"
          echo "Simulator picked: $name ($udid)"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: TomiRuntime tests (simulator)
        working-directory: apps/apple/Packages/TomiRuntime
        run: |
          xcodebuild test -scheme TomiRuntime \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath "$GITHUB_WORKSPACE/apps/apple/build/TomiRuntime.xcresult" -quiet
      - name: App tests (simulator)
        working-directory: apps/apple
        run: |
          xcodebuild test -project Tomi.xcodeproj -scheme Tomi \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath build/Tomi.xcresult -quiet
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-xcresult
          path: apps/apple/build/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
