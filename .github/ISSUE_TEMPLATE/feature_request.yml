name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tomi is end-to-end encrypted sharing between the devices of **one person**, through a **blind** relay.
        Please read the golden rules in AGENTS.md first: ideas that need the relay to read content, or that add
        recipients or permissions in v1, are out of scope. Changes to the protocol, crypto or wire format are
        discussed in an issue before any code.
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Core / protocol
        - Relay
        - Android
        - Windows
        - iOS
        - CLI
        - Documentation / specification
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: I checked that this does not weaken the golden rules (blind relay, secrets, format compatibility).
          required: true
