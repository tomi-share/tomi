<div class="board">
  <header class="board-head">
    <div>
      <h1>Planche d’états du panneau</h1>
      <p class="hint">Connexion, chargement, vide, erreur et variantes. Le parcours normal est dans <a href="index.html">index.html</a>.</p>

  <!-- ===================== Connexion ===================== -->
  <h2 class="group" id="connexion">Connexion</h2>
  <div class="specimens">
    <figure class="specimen">
      <figcaption><strong>Connexion</strong>Ni navigation ni barre : le logo et une carte.</figcaption>
      <div class="frame">
        <div class="auth">
          <svg class="logo-lockup" viewBox="0 52 634.4 173.2" role="img" aria-label="Tomi"><g transform="translate(-17.6 47.6) scale(0.8)"><path fill="currentColor" d="M61.93 70.13A94 94 0 1 1 61.93 185.87L80.84 171.1A70 70 0 1 0 80.84 84.9Z"/><path fill="currentColor" d="M22 128A32 32 0 1 0 86 128A32 32 0 1 0 22 128Z"/></g><g transform="translate(222.4 0)"><path fill="currentColor" d="M14 62V100H0V122H14V164A36 36 0 0 0 50 200H66V178H50A14 14 0 0 1 36 164V122H62V100H36V62Z"/><path fill="currentColor" fill-rule="evenodd" d="M86 150A52 52 0 1 0 190 150A52 52 0 1 0 86 150Z M108 150A30 30 0 1 1 168 150A30 30 0 1 1 108 150Z"/><path fill="currentColor" d="M212 200V100H234V105.89A44 44 0 0 1 289 114.9A44 44 0 0 1 366 144V200H344V144A22 22 0 0 0 300 144V200H278V144A22 22 0 0 0 234 144V200Z"/><path fill="currentColor" d="M390 100H412V200H390Z"/><path fill="currentColor" d="M387 66A14 14 0 1 0 415 66A14 14 0 1 0 387 66Z"/></g></svg>
          <div class="card">
            <h2>Connexion</h2>
            <p>Utilise ta clé d’accès : empreinte, visage ou code de l’appareil.</p>
            <a class="btn block" href="index.html">Se connecter avec ma clé d’accès</a>
            <p class="caption">La session se ferme après 30 min sans activité, 8 h au plus tard.</p>
          </div>
        </div>
      </div>
    </figure>

    <figure class="specimen">
      <figcaption><strong>Première visite : créer la clé d’accès</strong>La commande à lancer sur le serveur se copie d’un geste.</figcaption>
      <div class="frame">
        <div class="auth">
          <div class="card">
            <h2>Créer ma clé d’accès</h2>
            <p>Il te faut un code d’enrôlement, valable 15 min. Sur le serveur :</p>
            <div class="cmd"><code>tomi-relay admin web enroll</code><button type="button" class="icon-btn" data-copy="Commande" aria-label="Copier la commande"><svg class="ico"><use href="#i-copy"/></svg></button></div>
            <form autocomplete="off" novalidate onsubmit="return false">
              <label for="code">Code d’enrôlement</label>
              <input id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="xxxx-xxxx-xxxx" aria-describedby="code-hint">
              <p class="caption" id="code-hint">Majuscules, tirets et espaces sans importance · 5 essais au plus</p>
              <button type="submit" class="btn block">Créer ma clé d’accès</button>
            </form>
          </div>
        </div>
      </div>
    </figure>

    <figure class="specimen">
      <figcaption><strong>Navigateur non pris en charge</strong>Pas de clés d’accès (WebAuthn) : rien d’autre à faire ici.</figcaption>
      <div class="frame">
        <div class="auth">
          <div class="card">
            <h2>Navigateur non pris en charge</h2>
            <p>Ce navigateur ne gère pas les clés d’accès. Utilise un navigateur récent, en HTTPS.</p>
          </div>
        </div>
      </div>
    </figure>

    <figure class="specimen">
      <figcaption><strong>Session finie</strong>Retour à la connexion ; le message reste jusqu’à « Fermer ».</figcaption>
      <div class="frame">
        <div class="toast-zone">
          <div class="toast error">
            <svg class="ico"><use href="#i-error"/></svg>
            <p>La session a pris fin. Connecte-toi de nouveau.</p>
            <button type="button" class="btn ghost sm">Fermer</button>
          </div>
        </div>
      </div>
    </figure>
  </div>
