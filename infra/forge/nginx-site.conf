# Tomi relay — Nginx configuration for the site (example managed-server deployment).
#
# Versioned copy of the content to paste into the Nginx configuration editor of the site
# relay.example.org in the panel (the "Edit Files" → "Edit Nginx Configuration" button). The panel
# keeps its own "FORGE CONFIG / FORGE SSL (DO NOT REMOVE!)" blocks around it: put here ONLY the
# body of the `server {}` managed by us (the reverse proxy), not the panel's lines.
#
# Role: Nginx terminates TLS (certificate managed by the panel / Let's Encrypt) and proxies to the
# local relay, which listens on 127.0.0.1:8080 (never exposed). The relay is blind and sets
# `Cache-Control: no-store` and `X-Content-Type-Options: nosniff` on /v1/*; Nginx repeats them as
# defense in depth on /v1/ (see the location below), with no other application header.

charset utf-8;

# The largest request bodies are a JSON of 2 MiB at most (max_json_body_bytes, maximum base64
# envelope) and a blob part of 1 MiB (max_upload_part_bytes): spec/api-v1.md §2.2 and §8.4. 4 MiB is
# therefore enough, with a margin: a safety net before transmission; beyond it Nginx answers 413.
# Raise it if these two relay settings are raised.
client_max_body_size 4m;

# HSTS (without includeSubDomains or preload: the parent domain may host other subdomains),
# as in caddy/Caddyfile. The panel already adds other headers at site level: if HSTS is already
# set there, remove this line to avoid duplicating it.
add_header Strict-Transport-Security "max-age=31536000" always;
# Nginx inheritance pitfall: `add_header` is inherited from one level to the next ONLY if the lower
# level declares none. A future `add_header` in a `location` would therefore make this HSTS, set at
# `server` level, disappear: repeat it in that `location` then.

# JSON API: never cached, no MIME type guessing. `always` so that error responses get them too.
# `add_header` in this location masks those of the `server` level: HSTS is therefore repeated here.
# The proxy is identical to `location /` (nginx does not share proxy_* directives between two
# locations). If the relay already sets these headers, `proxy_hide_header` avoids duplicating them.
# For the same reason, the other headers the panel sets at `server` level (X-Frame-Options, etc.)
# do NOT apply on /v1/: no consequence for a JSON API, which is never displayed.
location /v1/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (doorbell + pairing channel): the client's Connection header is relayed (Upgrade
    # during a WS handshake), without depending on a `map` defined in http{}.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # WebSockets and long-polls last: no premature cut on read/write.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Monitoring probes do not clutter the log. The access log is switched off: the relay logs by
# itself (JSON, without body, headers or query string, api-v1.md §9). It only records the route
# pattern, so the token of a /create/<token> link appears nowhere.
# If an Nginx access log is re-enabled, it must mask the segment after /create/ (see
# infra/README.md, the access-log variant).
access_log off;
