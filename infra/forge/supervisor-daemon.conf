# Tomi relay — supervisor daemon (example managed-server deployment).
#
# Versioned copy of the "Daemon" created in the panel (Server → Daemons tab) to run the relay as a
# managed service. The panel itself writes this file to
# /etc/supervisor/conf.d/daemon-<id>.conf and names it `daemon-<id>`; the values below are the ones
# to enter in the panel's form.
#
# Equivalent, in the panel, of the systemd unit infra/systemd/tomi-relay.service (EC2/Caddy
# deployment). Here the user is `deploy` and the configuration goes through a config.toml (not the
# TOMI_RELAY_* variables). No systemd hardening (Protect*, SystemCallFilter): a supervisor daemon
# does not offer it; this is a deliberate choice to stay manageable from the panel's UI.
#
# Isolation (accepted limits). The relay runs under the SHARED user `deploy`, the same as the panel
# and the recipes: everything that runs as `deploy` can read the relay's data (databases, encrypted
# blobs, config.toml). Two mitigations here:
#   - `umask=077`: every file created by the relay (SQLite databases, WAL, blobs, admin socket)
#     is born 0600/0700, never 0644; the daemon must be restarted for it to apply.
#     The panel's form has no umask field and rewrites this file: if the line disappears, put it
#     back in /etc/supervisor/conf.d/daemon-<id>.conf (then `supervisorctl update`), or enter as
#     Command: bash -c 'umask 077; exec /home/deploy/relay.example.org/tomi-relay --config /home/deploy/tomi-data/config.toml'
#   - `/home/deploy/tomi-data` in 0700 (`chmod -R go-rwx`, see recipes/init-relay.sh) for the files
#     created before `umask=077`, and to close the folder to the other users of the server.
# Residual risk: the `deploy` user can still read everything, and replace the binary
# (/home/deploy/relay.example.org/tomi-relay, writable by its own runner: a compromised relay could
# rewrite itself). Recommended: a dedicated system user (`tomi`) owning tomi-data, a binary owned by
# `deploy` (or root) but not writable by `tomi`, and `user=tomi` below; see infra/forge/README.md §8.
#
# Fields of the panel's "New Daemon" form:
#   Command   : /home/deploy/relay.example.org/tomi-relay --config /home/deploy/tomi-data/config.toml
#   Directory : /home/deploy/tomi-data/
#   User      : deploy
#   Processes : 1
#   Start Secs: 3
#   Stop Signal / Wait : SIGTERM / 30

[program:tomi-relay]
directory=/home/deploy/tomi-data/
command=/home/deploy/relay.example.org/tomi-relay --config /home/deploy/tomi-data/config.toml
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=deploy
umask=077
numprocs=1
startsecs=3
redirect_stderr=true
stdout_logfile=/home/deploy/logs/tomi-relay.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=30
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
