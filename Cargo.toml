[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "apps/relay",
]
# Tauri has its own standalone workspace (own Cargo.lock / target) and depends on
# tomi-core by path. Keeps heavy Windows builds from contending with the rest.
exclude = [
    "apps/windows/src-tauri",
]

[workspace.package]
version = "0.6.0-beta.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tomi-share/tomi"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
