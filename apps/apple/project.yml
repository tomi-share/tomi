# Tomi for Apple platforms. `xcodegen generate` (in apps/apple) writes Tomi.xcodeproj, which is
# not committed: this file and the xcconfigs are the source of the project.
# Prerequisite: `just apple-core` (the Rust core as an XCFramework, see README.md).
name: Tomi
options:
  bundleIdPrefix: eu.shaffe
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  # English is the reference and the fallback; the other languages are in the String Catalog.
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Dev: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  # Release + developer tools (real core, relay of the space): `Tomi Dev` scheme, whose archive action uses Release.
  Dev: Config/Dev.xcconfig
  Release: Config/Release.xcconfig
packages:
  TomiCore:
    path: Packages/TomiCore
  TomiKit:
    path: Packages/TomiKit
  TomiDesign:
    path: Packages/TomiDesign
  TomiRuntime:
    path: Packages/TomiRuntime
targets:
  Tomi:
    type: application
    platform: iOS
    sources:
      - path: Tomi
      # Demo files of the core's demo mode (images, code files of the demo space). They were the
      # Android debug assets; Android now runs on the real core only, so they live here.
      # Shipped in every build: the released app can enter the demo from the real core.
      - path: DemoAssets/demo
        type: folder
        buildPhase: resources
    dependencies:
      - package: TomiRuntime
      - package: TomiKit
      - package: TomiDesign
      - target: TomiShare
    # The app group: the inbox of the share extension (the core moves there with PR-14).
    entitlements:
      path: Tomi/Tomi.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.shaffe.tomi]
        # The push doorbell (spec api-v1.md 6.4). Xcode signs a distribution build with `production` by itself.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi
        PRODUCT_NAME: Tomi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tomi/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tomi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # The three permission sentences, in English (the fallback); the other languages are in
        # Tomi/Resources/InfoPlist.xcstrings, generated by tools/strings-from-android.py from the same texts.
        # Asked only at the first "Save to gallery" of the image viewer (add only, no reading).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tomi saves to Photos the images you choose to add there."
        # Required on a real iPhone before any Face ID prompt (the simulator does not check it).
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Tomi asks for Face ID before showing, copying or sharing a hidden item."
        # Asked only when the user touches "Scan the QR code" on the pairing screen.
        INFOPLIST_KEY_NSCameraUsageDescription: "Tomi uses the camera only to scan the pairing QR code."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # One window: a second scene would open the core a second time on the same database.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # Share extension ("Share" -> Tomi). It never opens the core: it puts the share in the inbox of the app group,
  # which the app sends (docs/archive/apple-spec-implementation.md, section 10).
  TomiShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TomiShare
      - path: Tomi/Common/SendShared.swift
      - path: Tomi/Common/L10n.swift
      - path: Tomi/Common/FormComponents.swift
      - path: Tomi/Common/TomiLayout.swift
      - path: Tomi/Resources/Localizable.xcstrings
    dependencies:
      - package: TomiKit
      - package: TomiDesign
    entitlements:
      path: TomiShare/TomiShare.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.shaffe.tomi]
    info:
      path: TomiShare/Info.plist
      properties:
        CFBundleDisplayName: Tomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.share
        PRODUCT_NAME: TomiShare
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # Tomi for the Mac (docs/macos-app.md): the screens and the models of `Tomi/`, plus what only the Mac
  # has in `TomiMac/`. A file of `Tomi/` that cannot exist on the Mac is excluded here and has its Mac counterpart
  # in `TomiMac/`; the others carry `#if os(macOS)` branches.
  TomiMac:
    type: application
    platform: macOS
    sources:
      - path: Tomi
        excludes:
          # The permission sentences of the iOS app; those of the Mac app are in TomiMac/InfoPlist.xcstrings.
          - Resources/InfoPlist.xcstrings
          # The iOS entry point; the Mac one is TomiMac/TomiMacApp.swift.
          - App/TomiApp.swift
          # iOS background tasks: the Mac app stays open.
          - App/BackgroundWork.swift
          # UIKit only.
          - Common/CaptureShield.swift
          - Common/SystemShare.swift
          - Features/Pairing/QRScanner.swift
          - Features/Viewer/ZoomableImage.swift
          # A touch gesture: on the Mac, archiving is in the menu and the bar (TomiMac/SwipeToArchive.swift).
          - Features/Feed/SwipeToArchive.swift
      - path: TomiMac
        excludes:
          # The share extension of the Mac app (target TomiMacShare).
          - Share/**
      - path: DemoAssets/demo
        type: folder
        buildPhase: resources
    dependencies:
      - package: TomiRuntime
      - package: TomiKit
      - package: TomiDesign
      - target: TomiMacShare
    # XcodeGen writes the entitlements file from these properties (a file edited by hand would be emptied).
    entitlements:
      path: TomiMac/TomiMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The relay (HTTPS, WebSocket).
        com.apple.security.network.client: true
        # Files chosen in the open panel, places chosen in the save panel.
        com.apple.security.files.user-selected.read-write: true
        # "Save" writes in Downloads/Tomi with no dialog, or in the folder chosen in the settings (kept
        # as a security-scoped bookmark).
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # The inbox of the share extension: the group of the team, which needs no provisioning profile on macOS
        # (TomiKit `AppGroup.identifier` reads it from Info.plist, `TomiAppGroup`).
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)eu.shaffe.tomi]
        # The camera, asked only at a click on "Scan the QR code" (pairing from a phone already in the space).
        com.apple.security.device.camera: true
        # The wrapping key lives in the data protection keychain, which only serves an app signed with its
        # application identifier: this group makes Xcode sign the app with a provisioning profile (a team in
        # Config/Signing.local.xcconfig is required to build the Mac app). The key is written in this group (the
        # first one): never remove it, and list it too in the share extension if it must ever read the key.
        keychain-access-groups:
          - $(AppIdentifierPrefix)eu.shaffe.tomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi
        PRODUCT_NAME: Tomi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TomiMac/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tomi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # In English (the fallback); the other languages are in TomiMac/InfoPlist.xcstrings (generated).
        INFOPLIST_KEY_NSCameraUsageDescription: "Tomi uses the camera only to scan a QR code: the one of a device to join, or the one of an installation key."
        # Sandbox (TomiMac.entitlements) and hardened runtime from the first build: every distribution stays possible.
        ENABLE_HARDENED_RUNTIME: YES
        # Generated by tools/mac-app-icon.swift (the icon of the charter on the macOS icon grid).
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  TomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TomiTests
    dependencies:
      - target: Tomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.tests
        GENERATE_INFOPLIST_FILE: YES
  # Share extension of the Mac app ("Share" -> Tomi). The sheet and the logic of the iOS extension (TomiShare/),
  # in an AppKit view controller. It never opens the core: it puts the share in the inbox of the app group, which
  # the app (running in the menu bar) sends.
  TomiMacShare:
    type: app-extension
    platform: macOS
    sources:
      - path: TomiShare
        excludes:
          - ShareViewController.swift
      - path: TomiMac/Share
      - path: Tomi/Common/SendShared.swift
      - path: Tomi/Common/L10n.swift
      - path: Tomi/Common/FormComponents.swift
      - path: Tomi/Common/TomiLayout.swift
      - path: Tomi/Resources/Localizable.xcstrings
    dependencies:
      - package: TomiKit
      - package: TomiDesign
    entitlements:
      path: TomiMac/Share/TomiMacShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)eu.shaffe.tomi]
        # The files handed by the app that shares.
        com.apple.security.files.user-selected.read-only: true
    info:
      path: TomiMac/Share/Info.plist
      properties:
        CFBundleDisplayName: Tomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TomiAppGroup: $(TeamIdentifierPrefix)eu.shaffe.tomi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MacShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.share
        PRODUCT_NAME: TomiMacShare
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # The tests of the app, run against the Mac build of the shared screens and models (same sources as TomiTests).
  TomiMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TomiTests
      # What only the Mac app has.
      - path: TomiMacTests
    dependencies:
      - target: TomiMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.mactests
        GENERATE_INFOPLIST_FILE: YES
        # The module of the Mac app is named after its product, as the iOS one: `@testable import Tomi` in both.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tomi.app/Contents/MacOS/Tomi
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Tomi:
    build:
      targets:
        Tomi: all
    test:
      targets:
        - TomiTests
  Tomi Mac:
    build:
      targets:
        TomiMac: all
    test:
      targets:
        - TomiMacTests
  # The real core on a device, as published, with the developer tools (Config/Dev.xcconfig). Its archive action uses
  # Release on purpose: an archive of this scheme must never contain the developer tools (TOMI_DEV_TOOLS).
  Tomi Dev:
    build:
      targets:
        Tomi: all
    run:
      config: Dev
    profile:
      config: Dev
    archive:
      config: Release
