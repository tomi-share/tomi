# Tomi for Apple platforms. `xcodegen generate` (in apps/apple) writes Tomi.xcodeproj, which is
# not committed: this file and the xcconfigs are the source of the project.
# Prerequisite: `just apple-core` (the Rust core as an XCFramework, see README.md).
name: Tomi
options:
  bundleIdPrefix: eu.shaffe
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Dev: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  # Release + developer tools (real core, relay of the space): `Tomi Dev` scheme, whose archive action uses Release.
  Dev: Config/Dev.xcconfig
  Release: Config/Release.xcconfig
packages:
  TomiCore:
    path: Packages/TomiCore
  TomiKit:
    path: Packages/TomiKit
  TomiDesign:
    path: Packages/TomiDesign
  TomiRuntime:
    path: Packages/TomiRuntime
targets:
  Tomi:
    type: application
    platform: iOS
    sources:
      - path: Tomi
      # Demo files of the core's demo mode (images, code files of the demo space). They were the
      # Android debug assets; Android now runs on the real core only, so they live here.
      # Shipped in every build: the released app can enter the demo from the real core.
      - path: DemoAssets/demo
        type: folder
        buildPhase: resources
    dependencies:
      - package: TomiRuntime
      - package: TomiKit
      - package: TomiDesign
      - target: TomiShare
    # The app group: the inbox of the share extension (the core moves there with PR-14).
    entitlements:
      path: Tomi/Tomi.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.shaffe.tomi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi
        PRODUCT_NAME: Tomi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tomi/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tomi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Asked only when the user touches "Scanner le QR code" on the pairing screen.
        # Asked only at the first "Enregistrer dans la galerie" of the image viewer (add only, no reading).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tomi enregistre dans Photos les images que tu choisis d’y ajouter."
        # Required on a real iPhone before any Face ID prompt (the simulator does not check it).
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Tomi demande Face ID avant d’afficher, de copier ou de partager un contenu masqué."
        INFOPLIST_KEY_NSCameraUsageDescription: "Tomi utilise la caméra seulement pour scanner le QR code d’appairage."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # One window: a second scene would open the core a second time on the same database.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # Share extension ("Partager" -> Tomi). It never opens the core: it puts the share in the inbox of the app group,
  # which the app sends (docs/archive/apple-spec-implementation.md, section 10).
  TomiShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TomiShare
      - path: Tomi/Common/SendShared.swift
      - path: Tomi/Common/L10n.swift
      - path: Tomi/Common/FormComponents.swift
      - path: Tomi/Common/TomiLayout.swift
      - path: Tomi/Resources/Localizable.xcstrings
    dependencies:
      - package: TomiKit
      - package: TomiDesign
    entitlements:
      path: TomiShare/TomiShare.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.shaffe.tomi]
    info:
      path: TomiShare/Info.plist
      properties:
        CFBundleDisplayName: Tomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.share
        PRODUCT_NAME: TomiShare
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  TomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TomiTests
    dependencies:
      - target: Tomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.shaffe.tomi.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tomi:
    build:
      targets:
        Tomi: all
    test:
      targets:
        - TomiTests
  # The real core on a device, as published, with the developer tools (Config/Dev.xcconfig). Its archive action uses
  # Release on purpose: an archive of this scheme must never contain the developer tools (TOMI_DEV_TOOLS).
  Tomi Dev:
    build:
      targets:
        Tomi: all
    run:
      config: Dev
    profile:
      config: Dev
    archive:
      config: Release
