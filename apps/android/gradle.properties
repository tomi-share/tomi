org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Corner radii variant: false (default) = Tomi charter (8/12 dp), true = Material 3 Expressive (rounder). Override per build: -PtomiExpressiveRadii=true
# tomiExpressiveRadii=false

# Rust core (libtomi_core.so, built by Gradle with cargo-ndk): "release" (default, what ships) or "debug" (faster to compile, much slower at
# run time). Override per build: -PtomiCoreProfile=debug
# tomiCoreProfile=release

# Relay compiled into the app: OPTIONAL and empty by default (no domain in the sources). Without it the relay comes from the pairing link,
# a scanned QR code, the "Relais" field or the creation link. https only, host[:port]. Set it per build: -PtomiRelayUrl=https://relay.example.org
# or, to keep it out of the repository, in ~/.gradle/gradle.properties (user level).
# tomiRelayUrl=https://relay.example.org
